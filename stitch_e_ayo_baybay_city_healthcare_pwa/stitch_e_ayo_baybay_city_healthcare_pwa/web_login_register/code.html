  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="bg-surface-container-high border-b border-outline px-6 py-3">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <a href="../web-01-home/HomeWeb.html" class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-DEFAULT bg-primary flex items-center justify-center border border-outline">
            <span class="material-symbols-outlined text-on-primary text-[22px]" aria-hidden="true">health_and_safety</span>
          </div>
          <span class="font-headline text-headline-sm text-on-surface" data-design-text-token="headline-sm">E-Ayo</span>
        </a>
        <a href="../web-01-home/HomeWeb.html" class="font-label text-label-md text-on-surface underline" data-design-text-token="label-md">Back to Home</a>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
      <!-- Left 6 Cols: Welcome Illustration -->
      <div class="lg:col-span-6 flex flex-col gap-4">
        <div class="rounded-xl overflow-hidden bg-surface-container-high border border-outline p-3 shadow-sm">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrA5tasMQGiMHAi-yj89PsKmrUf0ZPB253qUdCMbAKKkye6tO5agxPMIlqKSXF-di1uV14ZN4jsjreUqP7Ug_LENWaeQPLTgXA0dSo86z_XdxgCv9STCh8X_0lmoLsI17JVsZhal2oo3zyL7jwicfZ-RWtajdxuZ8KgGFttVi7GRZyWvZNeIIeP8v1Bdifh4ROs4RZXMSHpiHarzO-Ri7m4paRO7PAfyA4gEIWYUJj7RxYBg5Bg0B3IvWA" alt="Friendly Baybay City healthcare worker welcoming a local family" class="w-full h-72 object-cover rounded-lg">
        </div>
        <h1 class="font-headline text-headline-lg text-on-surface text-balance" data-design-text-token="headline-lg">
          Your Health, Within Your City.
        </h1>
        <p class="font-body text-body-lg text-on-surface-variant text-pretty" data-design-text-token="body-lg">
          Log in as a Baybay City resident to manage appointments, or as a healthcare provider to confirm patient schedules.
        </p>
      </div>

      <!-- Right 6 Cols: Role Toggle & Form -->
      <div class="lg:col-span-6 flex flex-col gap-5">
        <div role="tablist" aria-label="Account type" class="flex p-1 rounded-full bg-surface-container border border-outline gap-1">
          <button role="tab" id="tab-patient" aria-selected="true" onclick="switchRole(&#39;patient&#39;)" class="flex-1 min-h-[48px] px-4 py-2 rounded-full bg-primary text-on-primary font-label text-label-md">
            <span data-design-text-token="label-md">Patient</span>
          </button>
          <button role="tab" id="tab-provider" aria-selected="false" onclick="switchRole(&#39;provider&#39;)" class="flex-1 min-h-[48px] px-4 py-2 rounded-full text-on-surface hover:bg-surface-container-high font-label text-label-md">
            <span data-design-text-token="label-md">Healthcare Provider</span>
          </button>
        </div>

        <div id="panel-patient" class="rounded-xl bg-surface-container-high border border-outline p-6 flex flex-col gap-4 shadow-sm">
          <h2 class="font-headline text-title-md text-on-surface" data-design-text-token="title-md">Patient Account</h2>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Mobile Number or Email</span>
            <input type="text" placeholder="0917 123 4567" class="min-h-[48px] rounded-DEFAULT bg-surface-container-low border border-outline px-4 py-3 font-body text-body-md text-on-surface">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Barangay in Baybay City</span>
            <select class="min-h-[48px] rounded-DEFAULT bg-surface-container-low border border-outline px-4 py-3 font-body text-body-md text-on-surface">
              <option>Brgy. Cogon</option>
              <option>Brgy. Poblacion</option>
              <option>Brgy. Galenzoga</option>
            </select>
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Password</span>
            <input type="password" placeholder="Enter your password" class="min-h-[48px] rounded-DEFAULT bg-surface-container-low border border-outline px-4 py-3 font-body text-body-md text-on-surface">
          </label>
          <a href="../web-01-home/HomeWeb.html" class="min-h-[48px] w-full px-6 py-3 rounded-full bg-primary text-on-primary font-label text-label-lg hover:bg-primary-deep inline-flex items-center justify-center shadow-sm">
            <span data-design-text-token="label-lg">Log In as Patient</span>
          </a>
        </div>

        <div id="panel-provider" hidden class="rounded-xl bg-surface-container-high border border-outline p-6 flex flex-col gap-4 shadow-sm">
          <h2 class="font-headline text-title-md text-on-surface" data-design-text-token="title-md">Healthcare Provider</h2>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Facility / Clinic Name</span>
            <input type="text" placeholder="Baybay Family Care Clinic" class="min-h-[48px] rounded-DEFAULT bg-surface-container-low border border-outline px-4 py-3 font-body text-body-md text-on-surface">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Clinic Contact Email</span>
            <input type="email" placeholder="admin@baybayclinic.ph" class="min-h-[48px] rounded-DEFAULT bg-surface-container-low border border-outline px-4 py-3 font-body text-body-md text-on-surface">
          </label>
          <a href="../web-07-provider-dashboard/ProviderDashboardWeb.html" class="min-h-[48px] w-full px-6 py-3 rounded-full bg-primary text-on-primary font-label text-label-lg hover:bg-primary-deep inline-flex items-center justify-center shadow-sm">
            <span data-design-text-token="label-lg">Open Provider Portal</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script>
    function switchRole(role) {
      const pTab = document.getElementById('tab-patient');
      const prTab = document.getElementById('tab-provider');
      const pPanel = document.getElementById('panel-patient');
      const prPanel = document.getElementById('panel-provider');
      if (role === 'patient') {
        pTab.className = 'flex-1 min-h-[48px] px-4 py-2 rounded-full bg-primary text-on-primary font-label text-label-md';
        prTab.className = 'flex-1 min-h-[48px] px-4 py-2 rounded-full text-on-surface hover:bg-surface-container-high font-label text-label-md';
        pPanel.hidden = false;
        prPanel.hidden = true;
      } else {
        prTab.className = 'flex-1 min-h-[48px] px-4 py-2 rounded-full bg-primary text-on-primary font-label text-label-md';
        pTab.className = 'flex-1 min-h-[48px] px-4 py-2 rounded-full text-on-surface hover:bg-surface-container-high font-label text-label-md';
        prPanel.hidden = false;
        pPanel.hidden = true;
      }
    }
  </script>


</body></html>
